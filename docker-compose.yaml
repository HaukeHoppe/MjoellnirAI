version: '3.8'

services:

  # =====================================================
  # Open WebUI
  # =====================================================

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    container_name: open-webui

    # Localhost only: expose it publicly through a TLS reverse proxy or tunnel
    # (Caddy, Cloudflare Tunnel, Tailscale), never as plain HTTP.
    ports:
      - "127.0.0.1:3000:8080"

    volumes:
      - ./pdfs:/data
      - ./open-webui-data:/app/backend/data

    environment:
      # No login at all: every visitor uses one shared ADMIN account, so anyone can see the API keys
      # in Admin Panel -> Connections, read all chats and install Functions/Tools (arbitrary Python
      # in this container). Only accepted on an empty open-webui-data/ (no existing users).
      - WEBUI_AUTH=False
      # Fixed signing key so sessions survive container rebuilds; public URL for links and OAuth.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      # Only these origins may call the API and open the chat websocket (default '*' = any website).
      # Must match the browser address exactly: scheme + host, no trailing slash; separate several with ';'.
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      - PIPELINES_URL=http://pipelines:9099

    restart: always

    depends_on:
      - pipelines
      - pipelines-capital


  # =====================================================
  # Open WebUI Pipelines
  # =====================================================

  pipelines:
    build:
      context: .
      dockerfile: Dockerfile.pipelines

    container_name: open-webui-pipelines

    # No published ports: Open WebUI reaches the pipelines servers over the internal
    # compose network. Anyone holding the API key can upload and run Python code here.

    volumes:
      - ./pdfs:/data

    environment: &pipelines_env
      # Pipeline print() output (e.g. rejected claims) shows up in docker logs immediately.
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:?set PIPELINES_API_KEY in .env}

    restart: always


  # =====================================================
  # Open WebUI Pipelines #2 - Capital Markets RAG
  # Loads pipelines-capital/capital_rag_pipeline.py on startup.
  # Add in Open WebUI as a second connection:
  #   http://pipelines-capital:9099  (key: PIPELINES_API_KEY from .env)
  # =====================================================

  pipelines-capital:
    build:
      context: .
      dockerfile: Dockerfile.pipelines

    container_name: open-webui-pipelines-capital

    volumes:
      - ./pdfs:/data
      - ./pipelines-capital:/app/pipelines

    environment: *pipelines_env

    restart: always


  # =====================================================
  # Caddy - HTTPS reverse proxy (VPS only)
  # Only starts with the "vps" profile: set COMPOSE_PROFILES=vps in the VPS .env.
  # Serves WEBUI_URL with an automatic Let's Encrypt certificate and forwards
  # to open-webui:8080 over the internal network. See Caddyfile.
  # =====================================================

  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    profiles: ["vps"]

    ports:
      - "80:80"         # ACME HTTP challenge + redirect to HTTPS
      - "443:443"       # HTTPS
      - "443:443/udp"   # HTTP/3

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates and ACME account; keep it to avoid Let's Encrypt rate limits
      - caddy-config:/config

    environment:
      # Not ":?"-required: compose checks variables of inactive profiles too, which would break
      # every local command. If either is empty, Caddy refuses to start and names the line.
      - WEBUI_URL=${WEBUI_URL:-}
      - ACME_EMAIL=${ACME_EMAIL:-}

    restart: always

    depends_on:
      - open-webui


volumes:
  caddy-data:
  caddy-config:
