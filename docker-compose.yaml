version: '3.8'

# On the VPS (LOG_DRIVER=journald) container logs go to the host's systemd journal, which deletes entries
# older than 14 days (MaxRetentionSec in /etc/systemd/journald.conf.d/, see README). The privacy policy
# promises this deletion period: the logs contain visitor IP addresses and model output derived from chats.
# Locally the Docker default (json-file) stays, since Docker Desktop has no journald.
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}

services:

  # =====================================================
  # Open WebUI
  # =====================================================

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
    container_name: open-webui

    # Localhost only: expose it publicly through a TLS reverse proxy or tunnel
    # (Caddy, Cloudflare Tunnel, Tailscale), never as plain HTTP.
    ports:
      - "127.0.0.1:3000:8080"

    volumes:
      - ./pdfs:/data
      - ./open-webui-data:/app/backend/data

    environment:
      # No public self-registration; new accounts (if signup is re-enabled) wait for admin approval.
      # Both are persistent settings: once stored in the DB, the Admin Panel value wins over these.
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=pending
      # Site name in the browser tab and the UI. Open WebUI appends " (Open WebUI)" to any custom name.
      - WEBUI_NAME=Capital Markets RAG
      # VPS: signs every request in as the account whose email is in this header. Caddy sets it
      # (guest user on WEBUI_URL, admin on the SSH-tunnel port), so visitors see no login screen.
      # Empty locally = normal login. With it set, a request without the header cannot log in.
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=${WEBUI_AUTH_TRUSTED_EMAIL_HEADER:-}
      # Login cookie only over HTTPS (browsers treat http://localhost as secure, so local use still works).
      - WEBUI_AUTH_COOKIE_SECURE=true
      # Fixed signing key so sessions survive container rebuilds; public URL for links and OAuth.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      # Only these origins may call the API and open the chat websocket (default '*' = any website).
      # Must match the browser address exactly: scheme + host, no trailing slash; separate several with ';'.
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      - PIPELINES_URL=http://pipelines:9099

    restart: always
    logging: *logging

    depends_on:
      - pipelines
      - pipelines-capital


  # =====================================================
  # Open WebUI Pipelines
  # =====================================================

  pipelines:
    build:
      context: .
      dockerfile: Dockerfile.pipelines

    container_name: open-webui-pipelines

    # No published ports: Open WebUI reaches the pipelines servers over the internal
    # compose network. Anyone holding the API key can upload and run Python code here.

    volumes:
      - ./pdfs:/data

    environment: &pipelines_env
      # Pipeline print() output (e.g. rejected claims) shows up in docker logs immediately.
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:?set PIPELINES_API_KEY in .env}

    restart: always
    logging: *logging


  # =====================================================
  # Open WebUI Pipelines #2 - Capital Markets RAG
  # Loads pipelines-capital/capital_rag_pipeline.py on startup.
  # Add in Open WebUI as a second connection:
  #   http://pipelines-capital:9099  (key: PIPELINES_API_KEY from .env)
  # =====================================================

  pipelines-capital:
    build:
      context: .
      dockerfile: Dockerfile.pipelines

    container_name: open-webui-pipelines-capital

    volumes:
      - ./pdfs:/data
      - ./pipelines-capital:/app/pipelines

    environment: *pipelines_env

    restart: always
    logging: *logging


  # =====================================================
  # Caddy - HTTPS reverse proxy (VPS only)
  # Only starts with the "vps" profile: set COMPOSE_PROFILES=vps in the VPS .env.
  # Serves WEBUI_URL with an automatic Let's Encrypt certificate and forwards
  # to open-webui:8080 over the internal network. See Caddyfile.
  # =====================================================

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy   # caddy:2.11-alpine + replace-response plugin (legal footer)
    image: caddy-legal-footer:2.11
    container_name: caddy
    profiles: ["vps"]

    ports:
      - "80:80"         # ACME HTTP challenge + redirect to HTTPS
      - "443:443"       # HTTPS
      - "443:443/udp"   # HTTP/3
      # Admin entrance, localhost only: reach it with  ssh -L 8081:127.0.0.1:8081 <vps>
      - "127.0.0.1:8081:8081"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./guest.css:/etc/caddy/guest.css:ro   # served to visitors as /static/custom.css
      - ./legal:/etc/caddy/legal:ro           # Impressum (and later Datenschutz) at /impressum
      - caddy-data:/data       # certificates and ACME account; keep it to avoid Let's Encrypt rate limits
      - caddy-config:/config

    environment:
      # Not ":?"-required: compose checks variables of inactive profiles too, which would break
      # every local command. If either is empty, Caddy refuses to start and names the line.
      - WEBUI_URL=${WEBUI_URL:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - GUEST_EMAIL=${GUEST_EMAIL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}

    restart: always
    logging: *logging

    depends_on:
      - open-webui


volumes:
  caddy-data:
  caddy-config:
